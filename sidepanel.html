<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ChromeMind</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🧠 ChromeMind</h1>
    <div class="toggles">
      <label><input type="checkbox" id="hybridToggle"> Hybrid (cloud fallback)</label>
      <label><input type="checkbox" id="streamToggle" checked> Stream</label>
    </div>
  </header>

  <section class="actions">
    <button id="btnSummarize">📄 Summarize page</button>
    <button id="btnTranslate">🌐 Translate selection → EN</button>
    <button id="btnProofread">✏️ Proofread selection</button>
    <button id="btnRewrite">🔄 Rewrite (clearer)</button>
  </section>

  <section class="prompt">
    <textarea id="promptInput" placeholder="Ask the on-device AI assistant..."></textarea>
    <div class="row">
      <select id="promptMode">
        <option value="creative">🎨 Creative</option>
        <option value="precise">🎯 Precise</option>
      </select>
      <button id="btnPrompt">▶️ Send</button>
    </div>
  </section>

  <section id="output" class="output"></section>

  <footer>
    <small>🔒 On-device first. Data stays on your device (unless Hybrid mode is active).</small>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
