# GitHub Projects Configuration
projects:
  - name: "ChromeMind Competition Board"
    description: "Project board for Google Chrome Built-in AI Challenge 2025"
    columns:
      - "📋 Backlog"
      - "🚀 Competition Priority"
      - "👷 In Progress"
      - "🧪 Testing"
      - "✅ Competition Ready"
      - "🏆 Complete"

# Issue Templates Configuration
issue_templates:
  - name: "🐛 Bug Report"
    about: "Report a bug or issue with ChromeMind"
  
  - name: "✨ Feature Request"  
    about: "Suggest a new feature or enhancement"
  
  - name: "🏆 Competition Feedback"
    about: "Feedback for the Google Chrome Built-in AI Challenge"
  
  - name: "🔒 Security Issue"
    about: "Report a security vulnerability"
  
  - name: "📚 Documentation"
    about: "Documentation improvements or questions"
  
  - name: "❓ Question"
    about: "Ask a question about ChromeMind"

# Repository Insights Configuration
insights:
  # Enable dependency graph
  dependency_graph: true
  
  # Enable security alerts
  security_alerts: true
  
  # Enable automated security fixes
  automated_security_fixes: true
  
  # Enable vulnerability reporting
  vulnerability_reporting: true

# Pages Configuration (for documentation)
pages:
  source:
    branch: "main"
    path: "/"
  
# Environments (for deployment)
environments:
  - name: "competition-demo"
    description: "Demo environment for competition judges"
    protection_rules:
      - type: "required_reviewers"
        users: ["glferreira-devsecops"]
  
  - name: "production"
    description: "Production release environment"
    protection_rules:
      - type: "required_reviewers"
        users: ["glferreira-devsecops"]
      - type: "branch_policy"
        branch_pattern: "main"