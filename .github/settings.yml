# 🏷️ Repository Settings for ChromeMind
# GitHub Repository Configuration for Google Chrome Built-in AI Challenge 2025

repository:
  # Repository Description
  description: "🧠 ChromeMind — Built-in AI Booster for Google Chrome Built-in AI Challenge 2025. Summarize, translate, proofread, rewrite and chat using Chrome's Built-in AI APIs directly in your browser."
  
  # Repository Topics/Tags
  topics: 
    - chrome-extension
    - built-in-ai
    - gemini-nano
    - google-chrome
    - ai-assistant
    - summarizer-api
    - translator-api
    - prompt-api
    - proofreader-api
    - writer-api
    - hackathon
    - devpost
    - manifest-v3
    - javascript
    - chrome-ai-challenge
    - google-chrome-challenge-2025
    - hybrid-ai
    - multimodal-ai
    - privacy-first
    - local-ai

  # Repository Settings
  homepage: "https://github.com/glferreira-devsecops/chromemind#readme"
  
  # Repository Features
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  
  # Default Branch
  default_branch: main
  
  # Allow/Disallow Features
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  allow_auto_merge: false
  delete_branch_on_merge: true
  
  # Repository Visibility (should be public for competition)
  private: false

# Branch Protection Rules
branches:
  - name: main
    protection:
      # Require pull request reviews
      required_status_checks:
        strict: true
        contexts:
          - "🚀 CI/CD Pipeline / 🔍 Extension Validation"
          - "🚀 CI/CD Pipeline / 🛡️ Security Audit"
          - "🚀 CI/CD Pipeline / 🧪 Chrome Extension Testing"
          - "🚀 CI/CD Pipeline / 🎯 Code Quality"
          - "🚀 CI/CD Pipeline / ♿ Accessibility Audit"
          - "🚀 CI/CD Pipeline / ⚡ Performance Analysis"
      
      # Pull Request Requirements
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        require_last_push_approval: false
        bypass_pull_request_allowances:
          users: ["glferreira-devsecops"]
          teams: []
          apps: []
      
      # Additional Protection
      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: false
      restrict_pushes:
        users: ["glferreira-devsecops"]
        teams: []
        apps: []

# Collaboration Settings
collaborators:
  # Add competition judges if needed
  # - username: "judge-username"
  #   permission: "read"

