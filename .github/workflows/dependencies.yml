name: 🔄 Dependency Management

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Mondays at 4 AM
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Update type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - all

env:
  NODE_VERSION: '18'

jobs:
  dependency-audit:
    name: 🔍 Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🔍 Dependency Security Audit
        run: |
          echo "🔍 Running dependency security audit..."
          
          # Run npm audit and capture output
          npm audit --json > audit-results.json || true
          
          # Analyze results
          node -e "
            const fs = require('fs');
            let results;
            
            try {
              results = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            } catch (e) {
              console.log('✅ No audit results file - likely no vulnerabilities');
              process.exit(0);
            }
            
            if (results.metadata && results.metadata.vulnerabilities) {
              const vulns = results.metadata.vulnerabilities;
              
              console.log('📊 Security Audit Summary:');
              console.log('  Total vulnerabilities:', vulns.total || 0);
              console.log('  Low:', vulns.low || 0);
              console.log('  Moderate:', vulns.moderate || 0);
              console.log('  High:', vulns.high || 0);
              console.log('  Critical:', vulns.critical || 0);
              
              if (vulns.critical > 0) {
                console.log('❌ Critical vulnerabilities require immediate attention!');
                process.exit(1);
              }
              
              if (vulns.high > 5) {
                console.log('⚠️  High number of high-severity vulnerabilities');
              }
              
              if (vulns.total === 0) {
                console.log('✅ No security vulnerabilities found');
              }
            } else {
              console.log('✅ No security vulnerabilities found');
            }
          "
          
      - name: 📋 Dependency Analysis
        run: |
          echo "📋 Analyzing dependency health..."
          
          node -e "
            const pkg = require('./package.json');
            const deps = pkg.dependencies || {};
            const devDeps = pkg.devDependencies || {};
            
            console.log('📦 Dependency Summary:');
            console.log('  Production dependencies:', Object.keys(deps).length);
            console.log('  Development dependencies:', Object.keys(devDeps).length);
            
            // Check for outdated patterns
            const allDeps = {...deps, ...devDeps};
            
            Object.entries(allDeps).forEach(([name, version]) => {
              // Check for exact versions (potential security risk)
              if (!/[~^]/.test(version)) {
                console.log('⚠️  Exact version pinning:', name, version);
              }
              
              // Check for very old major versions
              if (version.includes('^0.') || version.includes('~0.')) {
                console.log('⚠️  Pre-1.0 dependency:', name, version);
              }
            });
            
            console.log('✅ Dependency analysis completed');
          "
          
      - name: 📤 Upload Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: audit-results.json
          retention-days: 30

  check-updates:
    name: 🔄 Check for Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🔄 Check for Outdated Packages
        run: |
          echo "🔄 Checking for outdated packages..."
          
          # Generate outdated report
          npm outdated --json > outdated.json || true
          
          # Analyze outdated packages
          node -e "
            const fs = require('fs');
            let outdated = {};
            
            try {
              outdated = JSON.parse(fs.readFileSync('outdated.json', 'utf8'));
            } catch (e) {
              console.log('✅ All packages are up to date');
              process.exit(0);
            }
            
            const packages = Object.keys(outdated);
            
            if (packages.length === 0) {
              console.log('✅ All packages are up to date');
              process.exit(0);
            }
            
            console.log('📋 Outdated Packages:');
            console.log('=====================');
            
            let criticalUpdates = 0;
            let minorUpdates = 0;
            let patchUpdates = 0;
            
            packages.forEach(pkg => {
              const info = outdated[pkg];
              const current = info.current;
              const wanted = info.wanted;
              const latest = info.latest;
              
              console.log();
              console.log('📦', pkg);
              console.log('  Current:', current);
              console.log('  Wanted: ', wanted);
              console.log('  Latest: ', latest);
              
              // Determine update type
              const currentParts = current.split('.');
              const latestParts = latest.split('.');
              
              if (latestParts[0] !== currentParts[0]) {
                console.log('  🔴 Major update available');
                criticalUpdates++;
              } else if (latestParts[1] !== currentParts[1]) {
                console.log('  🟡 Minor update available');
                minorUpdates++;
              } else {
                console.log('  🟢 Patch update available');
                patchUpdates++;
              }
            });
            
            console.log();
            console.log('📊 Update Summary:');
            console.log('  🔴 Major updates:', criticalUpdates);
            console.log('  🟡 Minor updates:', minorUpdates);
            console.log('  🟢 Patch updates:', patchUpdates);
            
            // Create update recommendations
            if (patchUpdates > 0) {
              console.log();
              console.log('💡 Recommended: Apply patch updates (low risk)');
            }
            
            if (minorUpdates > 0) {
              console.log('💡 Consider: Minor updates after testing');
            }
            
            if (criticalUpdates > 0) {
              console.log('⚠️  Caution: Major updates may have breaking changes');
            }
          "
          
      - name: 📤 Upload Outdated Report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-packages-report
          path: outdated.json
          retention-days: 30

  auto-update:
    name: 🤖 Automated Updates
    runs-on: ubuntu-latest
    needs: [dependency-audit, check-updates]
    if: github.event_name == 'schedule' || github.event.inputs.update_type != ''
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🔄 Apply Updates
        run: |
          echo "🔄 Applying dependency updates..."
          
          # Determine update strategy
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"
          
          case "$UPDATE_TYPE" in
            "patch")
              echo "🟢 Applying patch updates only..."
              npm update --save
              ;;
            "minor")
              echo "🟡 Applying minor updates..."
              npm update --save
              # Additional logic for minor updates could go here
              ;;
            "major")
              echo "🔴 Major updates require manual review"
              echo "⚠️  This workflow will only create a report for major updates"
              ;;
            "all")
              echo "🔄 Applying all safe updates..."
              npm update --save
              ;;
          esac
          
      - name: 🧪 Test After Updates
        run: |
          echo "🧪 Testing extension after updates..."
          
          # Validate manifest
          npm run validate
          
          # Run syntax tests
          npm test
          
          # Check if extension still builds
          echo "📦 Verifying extension can be packaged..."
          mkdir -p test-build
          cp manifest.json test-build/
          cp service_worker.js test-build/
          cp sidepanel.html test-build/
          cp sidepanel.js test-build/
          cp content.js test-build/
          cp styles.css test-build/
          cp -r lib test-build/
          cp -r hybrid test-build/
          cp -r assets test-build/
          
          echo "✅ Extension builds successfully after updates"
          
      - name: 📋 Generate Update Report
        run: |
          echo "📋 Generating update report..."
          
          # Check what changed
          if git diff --quiet package.json package-lock.json; then
            echo "✅ No dependency updates were applied"
            echo "NO_UPDATES=true" >> $GITHUB_ENV
          else
            echo "📦 Dependencies were updated"
            
            # Generate detailed change report
            echo "📊 Package Changes:" > update-report.md
            echo "==================" >> update-report.md
            echo "" >> update-report.md
            
            if git diff --name-only | grep -q package.json; then
              echo "### Changed Dependencies" >> update-report.md
              echo "" >> update-report.md
              echo "\`\`\`diff" >> update-report.md
              git diff package.json >> update-report.md
              echo "\`\`\`" >> update-report.md
              echo "" >> update-report.md
            fi
            
            echo "### Security Impact" >> update-report.md
            echo "" >> update-report.md
            
            # Run audit after updates
            npm audit --json > post-update-audit.json || true
            
            node -e "
              const fs = require('fs');
              let results = {};
              
              try {
                results = JSON.parse(fs.readFileSync('post-update-audit.json', 'utf8'));
              } catch (e) {
                console.log('✅ No vulnerabilities after updates');
                return;
              }
              
              if (results.metadata && results.metadata.vulnerabilities) {
                const vulns = results.metadata.vulnerabilities;
                console.log('Post-update vulnerabilities:', vulns.total || 0);
              }
            " >> update-report.md
            
            echo "UPDATE_APPLIED=true" >> $GITHUB_ENV
          fi
          
      - name: 🔧 Create Pull Request
        if: env.UPDATE_APPLIED == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🔄 chore: update dependencies (${{ github.event.inputs.update_type || 'patch' }})
            
            - Applied ${{ github.event.inputs.update_type || 'patch' }} dependency updates
            - All tests pass after updates
            - Extension builds successfully
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>
          title: "🔄 Dependency Updates (${{ github.event.inputs.update_type || 'patch' }})"
          body: |
            ## 🔄 Automated Dependency Updates
            
            This PR contains automated dependency updates for ChromeMind.
            
            ### 📊 Update Summary
            - **Type**: ${{ github.event.inputs.update_type || 'patch' }} updates
            - **Date**: ${{ github.run_id }}
            - **Workflow**: Automated dependency management
            
            ### ✅ Validation
            - [x] Manifest validation passed
            - [x] Syntax tests passed  
            - [x] Extension builds successfully
            - [x] Security audit completed
            
            ### 🧪 Testing Required
            - [ ] Manual extension testing
            - [ ] Built-in AI APIs functionality
            - [ ] Cross-browser compatibility
            
            ### 📋 Changes
            See attached update report for detailed changes.
            
            ---
            🤖 This PR was created automatically by the dependency management workflow.
            Review carefully before merging, especially for minor/major updates.
          branch: dependency-updates-${{ github.run_number }}
          delete-branch: true

  security-update:
    name: 🚨 Security Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🚨 Check for Security Updates
        run: |
          echo "🚨 Checking for security updates..."
          
          # Run audit and fix
          npm audit fix --dry-run --json > security-fixes.json || true
          
          node -e "
            const fs = require('fs');
            let fixes = {};
            
            try {
              const content = fs.readFileSync('security-fixes.json', 'utf8');
              fixes = JSON.parse(content);
            } catch (e) {
              console.log('✅ No security fixes available');
              process.exit(0);
            }
            
            if (fixes.metadata && fixes.metadata.vulnerabilities) {
              const vulns = fixes.metadata.vulnerabilities;
              
              if (vulns.total > 0) {
                console.log('🚨 Security vulnerabilities found!');
                console.log('  Total:', vulns.total);
                console.log('  Critical:', vulns.critical || 0);
                console.log('  High:', vulns.high || 0);
                
                if (vulns.critical > 0 || vulns.high > 0) {
                  console.log('❗ Critical security updates required');
                  process.exit(1);
                }
              }
            }
          "
          
      - name: 🔧 Apply Security Fixes
        run: |
          echo "🔧 Applying security fixes..."
          
          # Apply automatic fixes
          npm audit fix
          
          # Verify fixes were applied
          npm audit --audit-level=high
          
      - name: 🧪 Test Security Fixes
        run: |
          echo "🧪 Testing after security fixes..."
          
          npm run validate
          npm test
          
          echo "✅ Security fixes applied and tested"