name: 🧠 ChromeMind CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Mondays at 2 AM

env:
  NODE_VERSION: '18'
  CHROME_MIN_VERSION: '128'

jobs:
  # 🔍 Static Analysis & Security
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Validate Manifest
        run: npm run validate

      - name: ✅ Test Syntax
        run: npm test

      - name: 🛡️ Security Audit
        run: npm audit --audit-level moderate

  # 🏗️ Chrome Extension Validation
  extension-validation:
    name: 🏗️ Extension Validation
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📋 Validate Manifest Schema
        run: |
          echo "🔍 Validating Manifest V3 Schema..."
          node -e "
            const manifest = require('./manifest.json');
            console.log('✅ Manifest Version:', manifest.manifest_version);
            console.log('✅ Extension Name:', manifest.name);
            console.log('✅ APIs Required:', manifest.permissions?.length || 0, 'permissions');
            console.log('✅ Content Scripts:', manifest.content_scripts?.length || 0);
            console.log('✅ Icons:', Object.keys(manifest.icons || {}).length);
            
            // Validate required fields
            const required = ['manifest_version', 'name', 'version', 'description'];
            const missing = required.filter(field => !manifest[field]);
            if (missing.length > 0) {
              console.error('❌ Missing required fields:', missing);
              process.exit(1);
            }
            
            // Validate Manifest V3
            if (manifest.manifest_version !== 3) {
              console.error('❌ Must use Manifest V3');
              process.exit(1);
            }
            
            console.log('🎉 Manifest validation passed!');
          "

      - name: 🔧 Check Built-in AI APIs
        run: |
          echo "🧠 Checking Built-in AI API Integration..."
          
          # Check for API integrations in code
          apis=("Summarizer" "Translator" "LanguageDetector" "Prompt" "Proofreader" "Writer" "Rewriter")
          found_apis=()
          
          for api in "${apis[@]}"; do
            if grep -r "$api" lib/ > /dev/null 2>&1; then
              echo "✅ Found $api API integration"
              found_apis+=("$api")
            fi
          done
          
          echo "📊 Total APIs integrated: ${#found_apis[@]}/7"
          
          if [ ${#found_apis[@]} -lt 5 ]; then
            echo "⚠️ Warning: Less than 5 APIs integrated"
          else
            echo "🎉 Excellent API coverage!"
          fi

      - name: 📦 Test Extension Package
        run: |
          echo "📦 Creating Extension Package..."
          
          # Create temporary package
          mkdir -p dist
          cp -r . dist/chromemind
          cd dist/chromemind
          
          # Remove unnecessary files
          rm -rf .git .github node_modules .gitignore package-lock.json
          
          # Create ZIP package
          zip -r ../chromemind-extension.zip . -x "*.DS_Store*" "*.git*"
          
          # Check package size
          size=$(du -h ../chromemind-extension.zip | cut -f1)
          echo "📊 Package size: $size"
          
          # Validate package contents
          unzip -l ../chromemind-extension.zip | grep -E "(manifest\.json|service_worker\.js|sidepanel\.html)"
          
          echo "✅ Extension package created successfully"

      - name: 🎯 Competition Readiness Check
        run: |
          echo "🏆 Competition Readiness Assessment..."
          
          # Check for competition requirements
          checks=0
          total=8
          
          # 1. English language support
          if grep -q "English" README.md; then
            echo "✅ English language support documented"
            ((checks++))
          fi
          
          # 2. Open source license
          if [ -f "LICENSE" ]; then
            echo "✅ Open source license present"
            ((checks++))
          fi
          
          # 3. Testing instructions
          if [ -f "TESTING.md" ]; then
            echo "✅ Testing instructions provided"
            ((checks++))
          fi
          
          # 4. GitHub repository
          if [ -f "README.md" ] && grep -q "github.com" README.md; then
            echo "✅ GitHub repository documented"
            ((checks++))
          fi
          
          # 5. Built-in AI APIs
          if grep -q "Built-in AI" README.md; then
            echo "✅ Built-in AI APIs documented"
            ((checks++))
          fi
          
          # 6. Manifest V3
          if grep -q '"manifest_version": 3' manifest.json; then
            echo "✅ Manifest V3 compliant"
            ((checks++))
          fi
          
          # 7. Problem statement
          if grep -q "problem" README.md; then
            echo "✅ Problem statement documented"
            ((checks++))
          fi
          
          # 8. Demo instructions
          if [ -f "DEVPOST_SUBMISSION.md" ]; then
            echo "✅ Demo/submission instructions provided"
            ((checks++))
          fi
          
          echo "📊 Competition Readiness: $checks/$total checks passed"
          
          if [ $checks -eq $total ]; then
            echo "🏆 READY FOR COMPETITION! All requirements met."
          elif [ $checks -ge 6 ]; then
            echo "⚠️ MOSTLY READY - Minor improvements needed"
          else
            echo "❌ NOT READY - Major requirements missing"
            exit 1
          fi

  # 🎨 Quality & Accessibility
  quality-check:
    name: 🎨 Quality & Accessibility
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 📏 Code Quality Metrics
        run: |
          echo "📊 Code Quality Analysis..."
          
          # Count lines of code
          total_lines=$(find . -name "*.js" -o -name "*.html" -o -name "*.css" | xargs wc -l | tail -1 | awk '{print $1}')
          echo "📝 Total lines of code: $total_lines"
          
          # Count files
          js_files=$(find . -name "*.js" | wc -l)
          html_files=$(find . -name "*.html" | wc -l)
          css_files=$(find . -name "*.css" | wc -l)
          
          echo "📁 JavaScript files: $js_files"
          echo "📁 HTML files: $html_files"
          echo "📁 CSS files: $css_files"
          
          # Check for TODO/FIXME comments
          todos=$(grep -r "TODO\|FIXME" --include="*.js" --include="*.html" --include="*.css" . | wc -l)
          echo "⚠️ TODO/FIXME comments: $todos"
          
          # File size analysis
          echo "📊 Largest files:"
          find . -name "*.js" -o -name "*.html" -o -name "*.css" | xargs ls -lh | sort -k5 -hr | head -5

      - name: 🔍 Accessibility Check
        run: |
          echo "♿ Accessibility Analysis..."
          
          # Check for accessibility attributes
          aria_labels=$(grep -r "aria-" --include="*.html" . | wc -l)
          alt_tags=$(grep -r "alt=" --include="*.html" . | wc -l)
          labels=$(grep -r "<label" --include="*.html" . | wc -l)
          
          echo "🏷️ ARIA labels: $aria_labels"
          echo "🖼️ Alt tags: $alt_tags"
          echo "🏷️ Form labels: $labels"
          
          # Check for semantic HTML
          semantic_tags=$(grep -r -E "<(main|nav|section|article|aside|header|footer)" --include="*.html" . | wc -l)
          echo "📝 Semantic HTML tags: $semantic_tags"
          
          if [ $semantic_tags -gt 0 ]; then
            echo "✅ Good semantic HTML usage"
          else
            echo "⚠️ Consider adding semantic HTML tags"
          fi

  # 🚀 Performance Analysis
  performance:
    name: 🚀 Performance Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 📊 Bundle Size Analysis
        run: |
          echo "📦 Performance Metrics..."
          
          # Calculate total size
          total_size=$(du -sh . | cut -f1)
          echo "📊 Total project size: $total_size"
          
          # Calculate individual component sizes
          lib_size=$(du -sh lib/ | cut -f1)
          assets_size=$(du -sh assets/ | cut -f1)
          
          echo "📚 Library size: $lib_size"
          echo "🎨 Assets size: $assets_size"
          
          # Count dependencies
          if [ -f "package.json" ]; then
            deps=$(node -e "console.log(Object.keys(require('./package.json').dependencies || {}).length)")
            dev_deps=$(node -e "console.log(Object.keys(require('./package.json').devDependencies || {}).length)")
            echo "📦 Dependencies: $deps production, $dev_deps development"
          fi
          
          # Performance recommendations
          echo "🎯 Performance Recommendations:"
          
          large_files=$(find . -type f -size +100k | wc -l)
          if [ $large_files -gt 0 ]; then
            echo "⚠️ Found $large_files files larger than 100KB"
            find . -type f -size +100k -exec ls -lh {} \;
          else
            echo "✅ No oversized files detected"
          fi

  # 📋 Documentation Check
  documentation:
    name: 📋 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 📚 Documentation Quality
        run: |
          echo "📖 Documentation Analysis..."
          
          # Check required documentation files
          docs=("README.md" "LICENSE" "TESTING.md")
          for doc in "${docs[@]}"; do
            if [ -f "$doc" ]; then
              size=$(wc -c < "$doc")
              echo "✅ $doc: ${size} bytes"
            else
              echo "❌ Missing: $doc"
            fi
          done
          
          # Check README quality
          if [ -f "README.md" ]; then
            sections=("Installation" "Usage" "Features" "API" "Contributing")
            for section in "${sections[@]}"; do
              if grep -qi "$section" README.md; then
                echo "✅ README section: $section"
              else
                echo "⚠️ Missing README section: $section"
              fi
            done
          fi
          
          # Check for competition-specific content
          competition_terms=("Chrome" "Built-in AI" "Hackathon" "Challenge" "Devpost")
          for term in "${competition_terms[@]}"; do
            if grep -qi "$term" README.md; then
              echo "✅ Competition reference: $term"
            fi
          done

  # 🎉 Success Summary
  success-summary:
    name: 🎉 Pipeline Success
    runs-on: ubuntu-latest
    needs: [static-analysis, extension-validation, quality-check, performance, documentation]
    if: success()
    steps:
      - name: 🎊 Success Notification
        run: |
          echo "🎉 ChromeMind CI/CD Pipeline Completed Successfully!"
          echo ""
          echo "✅ Static analysis passed"
          echo "✅ Extension validation passed"
          echo "✅ Quality checks passed"
          echo "✅ Performance analysis completed"
          echo "✅ Documentation verified"
          echo ""
          echo "🏆 ChromeMind is ready for the Google Chrome Built-in AI Challenge 2025!"
          echo "🚀 Repository demonstrates professional software development practices"
          echo "🧠 Built-in AI APIs are properly integrated and documented"
          echo "🔒 Security and quality standards are met"
          echo ""
          echo "🎯 Next steps:"
          echo "  1. Create demo video (3 minutes max)"
          echo "  2. Submit to Devpost competition"
          echo "  3. Monitor for judge feedback"