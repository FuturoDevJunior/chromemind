name: 📦 Release Management

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string

env:
  NODE_VERSION: '18'

jobs:
  validate-release:
    name: 🔍 Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✅ Run Full Test Suite
        run: |
          echo "🧪 Running comprehensive tests..."
          npm test
          npm run validate
          
      - name: 🔒 Security Validation
        run: |
          echo "🔒 Security pre-release check..."
          npm audit --audit-level moderate
          
      - name: 📋 Version Consistency Check
        run: |
          echo "📋 Checking version consistency..."
          
          # Extract version from package.json and manifest.json
          package_version=$(node -e "console.log(require('./package.json').version)")
          manifest_version=$(node -e "console.log(require('./manifest.json').version)")
          
          echo "📦 Package version: $package_version"
          echo "🔧 Manifest version: $manifest_version"
          
          if [ "$package_version" != "$manifest_version" ]; then
            echo "❌ Version mismatch between package.json and manifest.json"
            exit 1
          fi
          
          echo "✅ Version consistency verified"

  build-extension:
    name: 🏗️ Build Extension Package
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Create Distribution Package
        run: |
          echo "📦 Building ChromeMind extension package..."
          
          # Create clean build directory
          mkdir -p dist/chromemind-extension
          
          # Copy extension files (exclude development files)
          cp -r . dist/chromemind-extension/
          cd dist/chromemind-extension
          
          # Remove development and CI files
          rm -rf \
            .git \
            .github \
            node_modules \
            .gitignore \
            package-lock.json \
            .DS_Store \
            *.log \
            DEVPOST_SUBMISSION.md \
            GITHUB_READY.md \
            scripts/
          
          # Optimize for Chrome Web Store
          echo "🎯 Optimizing for Chrome Web Store..."
          
          # Validate final package
          ls -la
          
          echo "✅ Extension package prepared"

      - name: 📊 Package Analysis
        run: |
          cd dist/chromemind-extension
          
          echo "📊 Package Analysis:"
          echo "📁 Total files: $(find . -type f | wc -l)"
          echo "📦 Package size: $(du -sh . | cut -f1)"
          
          # Analyze file types
          echo "📋 File breakdown:"
          echo "  JavaScript: $(find . -name "*.js" | wc -l) files"
          echo "  HTML: $(find . -name "*.html" | wc -l) files"
          echo "  CSS: $(find . -name "*.css" | wc -l) files"
          echo "  Images: $(find . -name "*.png" -o -name "*.svg" | wc -l) files"
          echo "  Documentation: $(find . -name "*.md" | wc -l) files"
          
          # Check for essential files
          essential_files=("manifest.json" "service_worker.js" "sidepanel.html" "content.js")
          for file in "${essential_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file present"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

      - name: 📦 Create Release Archive
        run: |
          cd dist
          
          # Create ZIP package for Chrome Web Store
          zip -r chromemind-extension.zip chromemind-extension/ \
            -x "*.DS_Store*" "*.git*" "*.log*"
          
          # Create source code archive
          cd ..
          zip -r dist/chromemind-source.zip . \
            -x "dist/*" "node_modules/*" "*.DS_Store*" "*.git*" "*.log*"
          
          # Package information
          echo "📦 Created packages:"
          ls -lh dist/*.zip

      - name: 🔍 Final Package Validation
        run: |
          cd dist
          
          echo "🔍 Final package validation..."
          
          # Test ZIP integrity
          unzip -t chromemind-extension.zip
          unzip -t chromemind-source.zip
          
          # Check package size (Chrome Web Store limit is ~20MB)
          extension_size=$(du -b chromemind-extension.zip | cut -f1)
          size_mb=$((extension_size / 1024 / 1024))
          
          echo "📊 Extension package size: ${size_mb}MB"
          
          if [ $size_mb -gt 20 ]; then
            echo "❌ Package too large for Chrome Web Store (${size_mb}MB > 20MB)"
            exit 1
          else
            echo "✅ Package size acceptable for Chrome Web Store"
          fi

      - name: 📤 Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromemind-release-packages
          path: |
            dist/chromemind-extension.zip
            dist/chromemind-source.zip
          retention-days: 90

  create-github-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-extension
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: chromemind-release-packages
          path: ./dist

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          echo "📝 Generating release notes..."
          
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "🏷️ Release version: $VERSION"
          
          # Create release notes
          cat > release_notes.md << EOF
          # 🧠 ChromeMind v$VERSION - Built-in AI Extension
          
          ## ✨ What's New
          
          ChromeMind brings the power of Chrome's Built-in AI APIs directly to your browsing experience:
          
          ### 🚀 Features
          - 📄 **Smart Summarization**: Extract key points from any webpage
          - 🌐 **Instant Translation**: Translate selections automatically  
          - ✏️ **Grammar Review**: Fix errors and improve clarity
          - 🔄 **Creative Rewriting**: Transform text for better fluency
          - 🧠 **AI Chat**: Converse with on-device AI assistant
          - 🔒 **Privacy First**: All processing happens locally
          - ☁️ **Hybrid Fallback**: Optional cloud integration
          
          ### 🛠️ Technical Highlights
          - **7 Built-in AI APIs** integrated seamlessly
          - **Manifest V3** compliant Chrome extension
          - **Zero dependencies** - pure JavaScript implementation
          - **Professional code quality** with comprehensive testing
          - **Open source** under MIT license
          
          ### 🏆 Competition Ready
          Built for the **Google Chrome Built-in AI Challenge 2025**:
          - Demonstrates innovative use of Chrome's Built-in AI
          - Shows hybrid local+cloud architecture
          - Provides real user value and productivity gains
          
          ## 📦 Installation
          
          1. Download the \`chromemind-extension.zip\` file
          2. Open \`chrome://extensions/\` in Chrome
          3. Enable "Developer mode"
          4. Click "Load unpacked" and select the extracted folder
          5. Start using ChromeMind on any website!
          
          ## 🔗 Links
          - 📚 [Documentation](https://github.com/FuturoDevJunior/chromemind#readme)
          - 🧪 [Testing Guide](https://github.com/FuturoDevJunior/chromemind/blob/main/TESTING.md)
          - 🐛 [Report Issues](https://github.com/FuturoDevJunior/chromemind/issues)
          - 🏆 [Competition Entry](https://devpost.com/software/chromemind)
          
          ## 📊 Stats
          - **Package Size**: $(du -h dist/chromemind-extension.zip | cut -f1)
          - **Total Files**: $(unzip -l dist/chromemind-extension.zip | tail -1 | awk '{print $2}') files
          - **Chrome Version**: 128+ required
          - **License**: MIT
          
          ---
          
          **🎯 Ready for Google Chrome Built-in AI Challenge 2025!**
          EOF
          
          echo "release_notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: 🎉 Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: 🧠 ChromeMind ${{ github.ref }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: 📎 Upload Extension Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/chromemind-extension.zip
          asset_name: chromemind-extension.zip
          asset_content_type: application/zip

      - name: 📎 Upload Source Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/chromemind-source.zip
          asset_name: chromemind-source.zip
          asset_content_type: application/zip

  chrome-store-prep:
    name: 🏪 Chrome Web Store Preparation
    runs-on: ubuntu-latest
    needs: build-extension
    steps:
      - name: 📥 Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: chromemind-release-packages
          path: ./dist

      - name: 🏪 Store Readiness Check
        run: |
          echo "🏪 Chrome Web Store Readiness Assessment..."
          
          cd dist
          unzip -q chromemind-extension.zip
          cd chromemind-extension
          
          # Validate store requirements
          echo "📋 Validating Chrome Web Store requirements..."
          
          # Check manifest fields
          node -e "
            const manifest = require('./manifest.json');
            
            console.log('📦 Extension Details:');
            console.log('  Name:', manifest.name);
            console.log('  Version:', manifest.version);
            console.log('  Description:', manifest.description.substring(0, 100) + '...');
            console.log('  Permissions:', (manifest.permissions || []).length);
            console.log('  Icons:', Object.keys(manifest.icons || {}).length);
            
            // Store submission checklist
            const checks = {
              'Name length (3-75 chars)': manifest.name.length >= 3 && manifest.name.length <= 75,
              'Description length (10-132 chars)': manifest.description.length >= 10 && manifest.description.length <= 132,
              'Required icons present': manifest.icons && manifest.icons['16'] && manifest.icons['48'] && manifest.icons['128'],
              'Manifest V3 compliant': manifest.manifest_version === 3,
              'Version format valid': /^\d+\.\d+\.\d+$/.test(manifest.version)
            };
            
            console.log('\n🎯 Store Readiness Checklist:');
            Object.entries(checks).forEach(([check, passed]) => {
              console.log(passed ? '✅' : '❌', check);
            });
            
            const allPassed = Object.values(checks).every(Boolean);
            if (!allPassed) {
              console.log('\n❌ Some store requirements not met');
              process.exit(1);
            }
            
            console.log('\n🎉 Ready for Chrome Web Store submission!');
          "
          
          echo "✅ Chrome Web Store preparation completed"