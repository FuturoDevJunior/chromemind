name: 🔒 Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly security scan

jobs:
  security-scan:
    name: 🛡️ Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Dependency Security Audit
        run: |
          echo "🔍 Scanning for vulnerable dependencies..."
          npm audit --audit-level moderate
          
      - name: 🔒 Extension Security Check
        run: |
          echo "🔒 Chrome Extension Security Analysis..."
          
          # Check for sensitive data exposure
          echo "Checking for potential sensitive data exposure..."
          if grep -r -i "password\|secret\|key\|token" --include="*.js" --include="*.json" . | grep -v "placeholder\|example\|demo"; then
            echo "⚠️ Potential sensitive data found"
          else
            echo "✅ No sensitive data exposure detected"
          fi
          
          # Validate CSP compliance
          echo "Validating Content Security Policy compliance..."
          if grep -q "unsafe-eval\|unsafe-inline" manifest.json; then
            echo "❌ Unsafe CSP directives found"
            exit 1
          else
            echo "✅ CSP compliance verified"
          fi
          
          # Check permissions
          echo "Analyzing extension permissions..."
          node -e "
            const manifest = require('./manifest.json');
            const permissions = manifest.permissions || [];
            const hostPermissions = manifest.host_permissions || [];
            
            console.log('📋 Permissions:', permissions.join(', '));
            console.log('🌐 Host permissions:', hostPermissions.join(', '));
            
            // Flag overly broad permissions
            if (hostPermissions.includes('<all_urls>')) {
              console.log('⚠️ Extension requests access to all URLs - ensure this is necessary');
            }
            
            // Check for dangerous permissions
            const dangerous = ['tabs', 'history', 'bookmarks'];
            const found = permissions.filter(p => dangerous.includes(p));
            if (found.length > 0) {
              console.log('⚠️ Sensitive permissions found:', found.join(', '));
            }
          "

      - name: 🔐 Privacy Compliance Check
        run: |
          echo "🔐 Privacy Analysis..."
          
          # Check for data collection patterns
          if grep -r "localStorage\|sessionStorage\|indexedDB" --include="*.js" .; then
            echo "📊 Data storage detected - ensure compliance with privacy policies"
          fi
          
          # Check for network requests
          if grep -r "fetch\|XMLHttpRequest\|axios" --include="*.js" .; then
            echo "🌐 Network requests detected - verify data handling"
          fi
          
          # Verify hybrid mode privacy warnings
          if grep -q "Hybrid" sidepanel.html && grep -q "cloud" sidepanel.html; then
            echo "✅ Hybrid mode privacy warnings present"
          fi

  chrome-store-compliance:
    name: 🏪 Chrome Web Store Compliance
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Store Policy Validation
        run: |
          echo "🏪 Chrome Web Store Policy Compliance..."
          
          # Check manifest requirements
          node -e "
            const manifest = require('./manifest.json');
            
            // Required fields for store
            const required = ['name', 'description', 'version', 'icons'];
            const missing = required.filter(field => !manifest[field]);
            
            if (missing.length > 0) {
              console.error('❌ Missing required fields for Chrome Web Store:', missing);
              process.exit(1);
            }
            
            // Check description length
            if (manifest.description.length < 50) {
              console.log('⚠️ Description may be too short for Chrome Web Store');
            }
            
            // Validate icons
            const icons = manifest.icons || {};
            const requiredSizes = ['16', '48', '128'];
            const missingSizes = requiredSizes.filter(size => !icons[size]);
            
            if (missingSizes.length > 0) {
              console.log('⚠️ Missing icon sizes:', missingSizes);
            }
            
            console.log('✅ Basic Chrome Web Store requirements met');
          "
          
          # Check for prohibited content
          echo "Checking for prohibited content patterns..."
          
          prohibited_patterns=("bitcoin" "cryptocurrency" "gambling" "adult")
          for pattern in "${prohibited_patterns[@]}"; do
            if grep -ri "$pattern" --include="*.js" --include="*.html" --include="*.md" .; then
              echo "⚠️ Potential policy violation: $pattern"
            fi
          done
          
          echo "✅ No obvious policy violations detected"

      - name: 🎯 Competition Compliance
        run: |
          echo "🎯 Competition Requirements Verification..."
          
          # Verify Built-in AI usage
          if grep -q "Built-in AI" README.md; then
            echo "✅ Built-in AI usage documented"
          else
            echo "❌ Built-in AI usage not clearly documented"
            exit 1
          fi
          
          # Check for required APIs
          api_count=$(grep -r "Summarizer\|Translator\|Prompt\|Proofreader\|Writer" lib/ | wc -l)
          if [ $api_count -gt 5 ]; then
            echo "✅ Multiple Built-in AI APIs integrated ($api_count references)"
          else
            echo "⚠️ Limited API integration detected"
          fi
          
          # Verify open source compliance
          if [ -f "LICENSE" ]; then
            echo "✅ Open source license present"
          else
            echo "❌ Missing open source license"
            exit 1
          fi